# SPDX-License-Identifier: MIT
# Network defaults. `init/provision` replaces this file in a unit's image when
# other addresses are configured.

# Management port (1 GbE switch port labelled lan3 or lan4): SSH and installer TFTP.
MGMT_IF=lan3
MGMT_ADDRESS=192.168.1.1/24

# IQ export port: 10 GbE, jumbo frames carry one 8 KiB sample slice per datagram.
EXPORT_IF=eth1
EXPORT_ADDRESS=10.77.0.1/24
EXPORT_MTU=9216
